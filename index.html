<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello to the World</title>
  <style>
    :root {
      --bg1: #1e3a8a;
      --bg2: #7c3aed;
      --bg3: #ec4899;
      --card-bg: rgba(255,255,255,0.95);
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #8b5cf6;
      --accent-2: #f59e0b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
      color: white;
      padding: 24px;
    }

    .page {
      width: min(100%, 760px);
      text-align: center;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(2.7rem, 6vw, 5rem);
      line-height: 1.1;
      letter-spacing: 0.04em;
      text-shadow: 0 8px 18px rgba(0,0,0,0.18);
      animation: fadeIn 0.9s ease-out;
    }

    .tagline {
      margin: 0 0 42px;
      font-size: clamp(1rem, 2vw, 1.35rem);
      opacity: 0.9;
      animation: fadeIn 1.1s ease-out;
    }

    .card {
      background: var(--card-bg);
      color: var(--text);
      border-radius: 20px;
      padding: 30px 24px 38px;
      box-shadow: 0 24px 45px rgba(0,0,0,0.18);
      animation: riseUp 0.9s ease-out 0.2s both;
    }

    .card h2 {
      margin: 0 0 26px;
      font-size: clamp(1.5rem, 3vw, 2.2rem);
      color: var(--text);
    }

    .shape-stage {
      position: relative;
      height: 220px;
      width: 100%;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(139,92,246,0.08), rgba(59,130,246,0.08));
      margin-bottom: 20px;
    }

    .shape {
      position: absolute;
      opacity: 0;
      animation: morph 6s infinite ease-in-out;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.12));
    }

    .shape:nth-child(1) { animation-delay: 0s; }
    .shape:nth-child(2) { animation-delay: 0.8s; }
    .shape:nth-child(3) { animation-delay: 1.6s; }
    .shape:nth-child(4) { animation-delay: 2.4s; }
    .shape:nth-child(5) { animation-delay: 3.2s; }

    .square {
      width: 110px;
      height: 110px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 18px;
    }

    .circle {
      width: 110px;
      height: 110px;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      border-radius: 50%;
    }

    .triangle {
      width: 0;
      height: 0;
      border-left: 62px solid transparent;
      border-right: 62px solid transparent;
      border-bottom: 112px solid #10b981;
      background: transparent;
    }

    .diamond {
      width: 94px;
      height: 94px;
      background: linear-gradient(135deg, #ec4899, #f43f5e);
      transform: rotate(45deg);
      border-radius: 18px;
    }

    .hexagon {
      width: 110px;
      height: 110px;
      background: linear-gradient(135deg, #14b8a6, #22c55e);
      clip-path: polygon(25% 6%, 75% 6%, 100% 50%, 75% 94%, 25% 94%, 0% 50%);
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes riseUp {
      from { opacity: 0; transform: translateY(22px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes morph {
      0%, 12% {
        opacity: 0;
        transform: scale(0.5) rotate(0deg);
      }
      18%, 42% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
      52%, 70% {
        opacity: 1;
        transform: scale(1.08) rotate(45deg);
      }
      84%, 100% {
        opacity: 0;
        transform: scale(0.7) rotate(90deg);
      }
    }

    @media (max-width: 640px) {
      .card { padding: 24px 18px 28px; }
      .shape-stage { height: 180px; }
      .square, .circle, .hexagon { width: 80px; height: 80px; }
      .diamond { width: 68px; height: 68px; }
      .triangle {
        border-left: 44px solid transparent;
        border-right: 44px solid transparent;
        border-bottom: 80px solid #10b981;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>Hello to the World</h1>
    <p class="tagline">A warm welcome wrapped in color and motion.</p>

    <section class="card" aria-label="Animated shape gallery">
      <h2>Shapes in Motion</h2>
      <div class="shape-stage" aria-hidden="true">
        <div class="shape square"></div>
        <div class="shape circle"></div>
        <div class="shape triangle"></div>
        <div class="shape diamond"></div>
        <div class="shape hexagon"></div>
      </div>
      <p>
        A playful card showing animated geometric forms shifting between square, circle,
        triangle, diamond, and hexagon-inspired styles.
      </p>
    </section>
  </main>
</body>
</html>
